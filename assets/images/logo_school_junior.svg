<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bronzeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dfa878"/>
      <stop offset="50%" stop-color="#b88352"/>
      <stop offset="100%" stop-color="#7c4f26"/>
    </linearGradient>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261b14"/>
      <stop offset="100%" stop-color="#140d09"/>
    </linearGradient>
  </defs>

  <!-- Outer Cog / Lotus Seal -->
  <circle cx="80" cy="80" r="76" fill="url(#bgGrad2)" stroke="url(#bronzeGrad)" stroke-width="3.5"/>
  <circle cx="80" cy="80" r="69" fill="none" stroke="#b88352" stroke-width="1.2"/>

  <!-- Laurel Wreath Leaves (Left) -->
  <path d="M48,92 C42,80 44,65 52,53 C53,58 52,65 48,70 C46,62 50,55 57,50 C57,56 55,63 51,68 C56,60 62,56 68,54 C65,60 62,67 56,71 C62,67 69,67 73,69 C67,73 61,77 56,82 Z" fill="#b88352" opacity="0.85"/>
  <!-- Laurel Wreath Leaves (Right - Mirrored) -->
  <path d="M112,92 C118,80 116,65 108,53 C107,58 108,65 112,70 C114,62 110,55 103,50 C103,56 105,63 109,68 C104,60 98,56 92,54 C95,60 98,67 104,71 C98,67 91,67 87,69 C93,73 99,77 104,82 Z" fill="#b88352" opacity="0.85"/>

  <!-- Inner Diamond Symbol -->
  <polygon points="80,52 104,78 80,104 56,78" fill="#1b120c" stroke="url(#bronzeGrad)" stroke-width="2"/>

  <!-- Center Emblem: Wisdom Wheel / Dharma Chakra motif -->
  <circle cx="80" cy="78" r="16" fill="none" stroke="#dfa878" stroke-width="2.5"/>
  <circle cx="80" cy="78" r="5" fill="#dfa878"/>
  <line x1="80" y1="62" x2="80" y2="94" stroke="#dfa878" stroke-width="1.5"/>
  <line x1="64" y1="78" x2="96" y2="78" stroke="#dfa878" stroke-width="1.5"/>
  <line x1="69" y1="67" x2="91" y2="89" stroke="#dfa878" stroke-width="1.5"/>
  <line x1="69" y1="89" x2="91" y2="67" stroke="#dfa878" stroke-width="1.5"/>

  <!-- Ribbon at bottom -->
  <path d="M36,120 Q80,132 124,120 L122,129 Q80,140 38,129 Z" fill="#7c4f26" stroke="#b88352" stroke-width="1"/>
  <text x="80" y="127" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="7.5" font-weight="bold" fill="#fdfaf6" text-anchor="middle" letter-spacing="1">มัธยมศึกษาตอนต้น</text>
</svg>
