<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6be8a"/>
      <stop offset="50%" stop-color="#c59b6d"/>
      <stop offset="100%" stop-color="#8c5828"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2d1d13"/>
      <stop offset="100%" stop-color="#180f0a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Ring with dotted accent -->
  <circle cx="80" cy="80" r="76" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>
  <circle cx="80" cy="80" r="70" fill="none" stroke="#c59b6d" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Shield Base -->
  <path d="M45,45 Q80,35 115,45 Q115,85 80,118 Q45,85 45,45 Z" fill="#20150d" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Torch / Flame of Wisdom -->
  <path d="M80,48 C76,55 74,58 74,63 C74,68 77,71 80,71 C83,71 86,68 86,63 C86,58 84,55 80,48 Z" fill="#f59e0b"/>
  <path d="M80,53 C78,57 77,59 77,62 C77,65 78.5,67 80,67 C81.5,67 83,65 83,62 C83,59 82,57 80,53 Z" fill="#fef08a"/>
  <!-- Torch Handle -->
  <polygon points="76,71 84,71 82,82 78,82" fill="#c59b6d"/>

  <!-- Open Book of Knowledge -->
  <path d="M80,85 C73,81 60,81 53,84 L53,99 C60,96 73,96 80,100 C87,96 100,96 107,99 L107,84 C100,81 87,81 80,85 Z" fill="#fdfaf6" stroke="#c59b6d" stroke-width="1.5"/>
  <line x1="80" y1="85" x2="80" y2="100" stroke="#8c5828" stroke-width="1.5"/>

  <!-- Star accents -->
  <polygon points="80,34 82,39 87,39 83,42 85,47 80,44 75,47 77,42 73,39 78,39" fill="#e6be8a"/>
  <polygon points="40,80 41.5,83 45,83 42,85 43,88 40,86 37,88 38,85 35,83 38.5,83" fill="#c59b6d"/>
  <polygon points="120,80 121.5,83 125,83 122,85 123,88 120,86 117,88 118,85 115,83 118.5,83" fill="#c59b6d"/>

  <!-- Banner at bottom -->
  <path d="M38,124 Q80,134 122,124 L120,132 Q80,142 40,132 Z" fill="#8c5828" stroke="#c59b6d" stroke-width="1"/>
  <text x="80" y="131" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="7.5" font-weight="bold" fill="#fdfaf6" text-anchor="middle" letter-spacing="1">มัธยมศึกษาตอนปลาย</text>
</svg>
