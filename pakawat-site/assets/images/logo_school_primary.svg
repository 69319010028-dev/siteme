<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="warmAmberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0b87c"/>
      <stop offset="50%" stop-color="#ca8a4b"/>
      <stop offset="100%" stop-color="#8c4b18"/>
    </linearGradient>
    <linearGradient id="primaryBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1c12"/>
      <stop offset="100%" stop-color="#160e08"/>
    </linearGradient>
  </defs>

  <!-- Circular Base with decorative outer teeth -->
  <circle cx="80" cy="80" r="76" fill="url(#primaryBg)" stroke="url(#warmAmberGrad)" stroke-width="3.5"/>
  <circle cx="80" cy="80" r="68" fill="none" stroke="#ca8a4b" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Sun Rays of Growing Future (symbolizing primary education) -->
  <g stroke="#f0b87c" stroke-width="1.5" opacity="0.6">
    <line x1="80" y1="46" x2="80" y2="40"/>
    <line x1="62" y1="52" x2="57" y2="47"/>
    <line x1="98" y1="52" x2="103" y2="47"/>
    <line x1="50" y1="68" x2="44" y2="66"/>
    <line x1="110" y1="68" x2="116" y2="66"/>
  </g>

  <!-- Sprouting Plant / Seedling of Knowledge in Open Book -->
  <!-- Open Book -->
  <path d="M80,82 C72,78 58,78 50,81 L50,96 C58,93 72,93 80,97 C88,93 102,93 110,96 L110,81 C102,78 88,78 80,82 Z" fill="#fff9f0" stroke="#ca8a4b" stroke-width="1.5"/>
  <line x1="80" y1="82" x2="80" y2="97" stroke="#8c4b18" stroke-width="1.5"/>

  <!-- Sprout Leaves -->
  <path d="M80,80 C74,74 70,64 74,56 C79,62 81,71 80,80 Z" fill="#4ade80"/>
  <path d="M80,80 C86,74 90,64 86,56 C81,62 79,71 80,80 Z" fill="#22c55e"/>
  <!-- Little Golden Star above sprout -->
  <polygon points="80,48 81.5,52 86,52 82.5,54.5 84,59 80,56 76,59 77.5,54.5 74,52 78.5,52" fill="#fbbf24"/>

  <!-- Ribbon at bottom -->
  <path d="M38,122 Q80,132 122,122 L120,131 Q80,141 40,131 Z" fill="#8c4b18" stroke="#ca8a4b" stroke-width="1"/>
  <text x="80" y="129" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="8" font-weight="bold" fill="#fdfaf6" text-anchor="middle" letter-spacing="1">ระดับประถมศึกษา</text>
</svg>
