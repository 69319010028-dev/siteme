<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="vocGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d098"/>
      <stop offset="50%" stop-color="#d49b57"/>
      <stop offset="100%" stop-color="#8c531d"/>
    </linearGradient>
    <linearGradient id="vocBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a1a10"/>
      <stop offset="100%" stop-color="#150d08"/>
    </linearGradient>
    <filter id="gearShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Cogwheel (Gear) - Symbol of Vocational / Technical Education -->
  <g fill="url(#vocGold)" filter="url(#gearShadow)">
    <circle cx="80" cy="80" r="74"/>
    <!-- 12 Gear Teeth -->
    <rect x="73" y="2" width="14" height="12" rx="3"/>
    <rect x="73" y="146" width="14" height="12" rx="3"/>
    <rect x="2" y="73" width="12" height="14" rx="3"/>
    <rect x="146" y="73" width="12" height="14" rx="3"/>
    <rect x="22" y="22" width="14" height="12" rx="3" transform="rotate(45 29 28)"/>
    <rect x="124" y="22" width="14" height="12" rx="3" transform="rotate(-45 131 28)"/>
    <rect x="22" y="124" width="14" height="12" rx="3" transform="rotate(-45 29 130)"/>
    <rect x="124" y="124" width="14" height="12" rx="3" transform="rotate(45 131 130)"/>
    <rect x="42" y="7" width="13" height="11" rx="2" transform="rotate(22.5 48.5 12.5)"/>
    <rect x="105" y="7" width="13" height="11" rx="2" transform="rotate(-22.5 111.5 12.5)"/>
    <rect x="42" y="142" width="13" height="11" rx="2" transform="rotate(-22.5 48.5 147.5)"/>
    <rect x="105" y="142" width="13" height="11" rx="2" transform="rotate(22.5 111.5 147.5)"/>
  </g>

  <!-- Inner Dark Disc -->
  <circle cx="80" cy="80" r="64" fill="url(#vocBg)" stroke="#f5d098" stroke-width="2"/>
  <circle cx="80" cy="80" r="58" fill="none" stroke="#d49b57" stroke-width="1.2" stroke-dasharray="3,2" opacity="0.7"/>

  <!-- Technical Circuit / Diamond Shield Emblem -->
  <polygon points="80,38 114,64 114,92 80,112 46,92 46,64" fill="#1e120b" stroke="url(#vocGold)" stroke-width="2.5"/>

  <!-- Tech Flame / Torch of Innovation -->
  <path d="M80,44 C75,52 72,56 72,61 C72,66 76,69 80,69 C84,69 88,66 88,61 C88,56 85,52 80,44 Z" fill="#f59e0b"/>
  <path d="M80,49 C77,54 75,57 75,60 C75,63 77,65 80,65 C83,65 85,63 85,60 C85,57 83,54 80,49 Z" fill="#fef08a"/>
  
  <!-- Digital Nodes & Computer / Book Element -->
  <path d="M80,75 C72,70 60,70 54,73 L54,89 C60,86 72,86 80,90 C88,86 100,86 106,89 L106,73 C100,70 88,70 80,75 Z" fill="#fff9f2" stroke="#d49b57" stroke-width="1.5"/>
  <line x1="80" y1="75" x2="80" y2="90" stroke="#8c531d" stroke-width="1.5"/>

  <!-- Little Digital Tech Dots -->
  <circle cx="58" cy="81" r="2.5" fill="#d49b57"/>
  <circle cx="102" cy="81" r="2.5" fill="#d49b57"/>
  <line x1="58" y1="81" x2="68" y2="81" stroke="#d49b57" stroke-width="1"/>
  <line x1="102" y1="81" x2="92" y2="81" stroke="#d49b57" stroke-width="1"/>

  <!-- Bottom Ribbon with Certificate Title -->
  <path d="M30,120 Q80,132 130,120 L128,130 Q80,142 32,130 Z" fill="#8c531d" stroke="#f5d098" stroke-width="1"/>
  <text x="80" y="127" font-family="'Sarabun', 'Noto Sans Thai', sans-serif" font-size="7.5" font-weight="bold" fill="#fdfaf6" text-anchor="middle" letter-spacing="0.5">ระดับ ปวส. เทคนิค</text>
</svg>
